[General]
ColorScheme=Matugen
Name=Matugen

[Colors:Window]
# 180 out of 255 gives roughly 70% opacity for a nice frosted glass effect
BackgroundNormal={{colors.surface_container.default.red}},{{colors.surface_container.default.green}},{{colors.surface_container.default.blue}},180
ForegroundNormal={{colors.on_surface.default.hex}}

[Colors:Button]
# 150 out of 255 gives a translucent button highlight layout
BackgroundNormal={{colors.surface_container_high.default.red}},{{colors.surface_container_high.default.green}},{{colors.surface_container_high.default.blue}},150
ForegroundNormal={{colors.on_surface.default.hex}}

[Colors:Header]
BackgroundNormal={{colors.surface_container_high.default.red}},{{colors.surface_container_high.default.green}},{{colors.surface_container_high.default.blue}},150
ForegroundNormal={{colors.on_surface.default.hex}}
# This specifically fixes the white top bar
BackgroundAlternate={{colors.surface_container.default.red}},{{colors.surface_container.default.green}},{{colors.surface_container.default.blue}},180

[Colors:View]
# Deeper transparency for file list viewports (like Dolphin's file panel)
BackgroundNormal={{colors.surface_container_lowest.default.red}},{{colors.surface_container_lowest.default.green}},{{colors.surface_container_lowest.default.blue}},140
ForegroundNormal={{colors.on_surface.default.hex}}
