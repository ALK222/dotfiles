[General]
ColorScheme=Matugen
Name=Matugen

[Colors:Window]
# 180 out of 255 gives roughly 70% opacity for a nice frosted glass effect
BackgroundNormal={{colors.surface_container.default.hex | r}},{{colors.surface_container.default.hex | g}},{{colors.surface_container.default.hex | b}},180
ForegroundNormal={{colors.on_surface.default.hex}}

[Colors:Button]
# 150 out of 255 gives a translucent button highlight layout
BackgroundNormal={{colors.surface_container_high.default.hex | r}},{{colors.surface_container_high.default.hex | g}},{{colors.surface_container_high.default.hex | b}},150
ForegroundNormal={{colors.on_surface.default.hex}}

[Colors:Header]
BackgroundNormal={{colors.surface_container_high.default.hex | r}},{{colors.surface_container_high.default.hex | g}},{{colors.surface_container_high.default.hex | b}},150
ForegroundNormal={{colors.on_surface.default.hex}}
# This specifically fixes the white top bar
BackgroundAlternate={{colors.surface_container.default.rgb.r}},{{colors.surface_container.default.rgb.g}},{{colors.surface_container.default.rgb.b}},180

[Colors:View]
# Deeper transparency for file list viewports (like Dolphin's file panel)
BackgroundNormal={{colors.surface_container_lowest.default.rgb.r}},{{colors.surface_container_lowest.default.rgb.g}},{{colors.surface_container_lowest.default.rgb.b}},140
ForegroundNormal={{colors.on_surface.default.hex}}